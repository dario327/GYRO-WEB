<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #caja{
            width: 200px;
            height: 200px;
            background-color: aqua;
            position: absolute;
            top: 8%;
        }
    </style>
</head>
<body>
    <div id="caja"></div>
    <button id="salar">Permirit</BUtton>

    <script>
document.getElementById("salar").addEventListener("click", onClick);

function onClick() {
    if (typeof DeviceOrientationEvent.requestPermission === "function") {

        DeviceOrientationEvent.requestPermission()
        .then(state => {
            if (state === "granted") {
                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );
            }
        })
        .catch(console.error);

    } else {
        window.addEventListener(
            "deviceorientation",
            handleOrientation
        );
    }
}

function handleOrientation(event) {

    document.getElementById("caja").innerHTML =
        Math.round(event.alpha) + " " +
        Math.round(event.beta) + " " +
        Math.round(event.gamma);

    mover(event);
}

function mover(e) {

    let cordX = e.gamma * 3;
    let cordY = e.beta * 3;

    document.getElementById("caja").style.transform =
        `translate(${cordX}px, ${cordY}px)`;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #caja{
            width: 200px;
            height: 200px;
            background-color: aqua;
            position: absolute;
            top: 8%;
        }
    </style>
</head>
<body>
    <div id="caja"></div>
    <button id="salar">Permirit</BUtton>

    <script>
        window.addEventListener('deviceorientation', handleOrientation);

        function handleOrientation(event) {
            document.getElementById("caja").innerHTML = event.alpha+" "+event.beta+" "+event.gamma;
            mover(event);
        }
        document.getElementById("salar").addEventListener("click",onClick);
        function onClick() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Handle iOS 13+ devices.
                DeviceOrientationEvent.requestPermission()
                .then((state) => {
                    if (state === 'granted') {
                        window.addEventListener("deviceorientation", handleOrientation);
                    } else {
                        console.error('Request to access the orientation was rejected');
                    }
                })
                .catch(console.error);
            } else {
                // Handle regular non iOS 13+ devices.
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function mover(e){
            let cordX = e.beta * 3;
            let cordY = e.gamma * 3;

            document.getElementById("caja").style.transform =  `translate(${cordX}px, ${cordY}px)`
        }

    </script>
</body>
</html>

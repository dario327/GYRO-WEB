<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYRO-WEB</title>
    <style>
        body{
            background-color: beige;
        }
        #caja{
            width: 200px;
            height: 200px;
            background-color: aquamarine;
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 100px;
        }
        #angulos{
            font-family: 'Courier New', Courier, monospace;
        }
        #btnPermitir{
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            text-transform: uppercase;
            border-width: 0;
            color: white;
            background-color: grey;
        }
    </style>
</head>
<body>
    <button id="btnPermitir">Permitir</button>
    <p id="angulos"></p>
    <div id="caja"></div>

    <script>
        window.addEventListener('deviceorientation',mover);
        
        function mover(evento){
            let cordX = evento.beta;
            let cordY = evento.gamma;

            document.getElementById("angulos").innerHTML = `Alfa: ${evento.alpha}<br>Beta: ${cordX}<br>Gamma: ${cordY}`;
            document.getElementById("caja").style.transform = `translate(${cordY}px, ${cordX}px)`;
        }

        function onClick() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Handle iOS 13+ devices.
                DeviceOrientationEvent.requestPermission()
                .then((state) => {
                    if (state === 'granted') {
                        window.addEventListener('deviceorientation',mover);
                    } else {
                        console.error('Request to access the orientation was rejected');
                    }
                })
                .catch(console.error);
            } else {
                // Handle regular non iOS 13+ devices.
                window.addEventListener('deviceorientation', mover);
            }
        }

        document.getElementById("btnPermitir").addEventListener("click",onClick);
    </script>
</body>
</html>
